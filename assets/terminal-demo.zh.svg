fill="#c8ace8" xml:space="preserve">/workflow<tspan x="171.56" fill="#93939f">这个项目的做事节奏</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0888;0.3238" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="235" fill="#c8ace8" xml:space="preserve">/about-site<tspan x="171.56" fill="#93939f">为什么主页是一个终端</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0929;0.3238" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="258" fill="#c8ace8" xml:space="preserve">/chat<tspan x="171.56" fill="#93939f">可以从这些话题开始</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0970;0.3238" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="281" fill="#c8ace8" xml:space="preserve">/patchpilot<tspan x="171.56" fill="#93939f">一个 Python 编码智能体实验</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1011;0.3238" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="304" fill="#c8ace8" xml:space="preserve">/mini-renderer<tspan x="171.56" fill="#93939f">从三角形开始的图形实验</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1052;0.3238" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="327" fill="#c8ace8" xml:space="preserve">/systems<tspan x="171.56" fill="#93939f">沿着程序走进系统</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1093;0.3238" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="350" fill="#93939f" xml:space="preserve">… 还有 8 条，在终端里输入 /help 查看</text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1134;0.3238" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="373" fill="#9cbdb0">guest@crystal:~ $</text><rect x="180.24" y="361" width="8.68" height="16" fill="#c8ace8"><animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3355;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><clipPath id="type-1"><rect x="180.24" y="56" height="23" width="0"><animate attributeName="width" values="0;9.7;18.4;27.0;35.7;44.4;53.1;400" keyTimes="0;0.3425;0.3495;0.3565;0.3635;0.3705;0.3776;0.3846" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/></rect></clipPath><text x="24" y="74" fill="#9cbdb0">guest@crystal:~ $</text><text x="180.24" y="74" fill="#dddce2" clip-path="url(#type-1)">/whoami</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4021;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="97" fill="#c8ace8" font-weight="600" xml:space="preserve">AngeCrystal</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4062;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="120" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4103;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="143" fill="#c9c8d0" xml:space="preserve">喜欢拆开黑箱，也喜欢走进故事。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4144;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="166" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4185;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="189" fill="#c9c8d0" xml:space="preserve">我对 OS、系统、AI 和 Agent 很感兴趣。比起只知道一个工具能做什么，我也想追问：它为什么这样运行，又能做成什么？</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4226;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="212" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4267;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="235" fill="#c9c8d0" xml:space="preserve">这里是一张会慢慢长大的个人名片。你可以看看工作台上的项目，翻翻正在关注的技术方向，或者绕到终端之外，聊聊桌游、</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4307;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="258" fill="#c9c8d0" xml:space="preserve">动漫和二游。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4348;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="281" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4389;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="304" fill="#c9c8d0" xml:space="preserve">我不太想把自己排成一张技能表。输入几条命令，可能比读一串标签更接近认识我的过程。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4430;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="327" fill="#93939f" xml:space="preserve">…</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4471;0.6575" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="350" fill="#9cbdb0">guest@crystal:~ $</text><rect x="180.24" y="338" width="8.68" height="16" fill="#c8ace8"><animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6692;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><clipPath id="type-2"><rect x="180.24" y="56" height="23" width="0"><animate attributeName="width" values="0;9.7;18.4;27.0;35.7;44.4;400" keyTimes="0;0.6762;0.6832;0.6902;0.6973;0.7043;0.7113" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/></rect></clipPath><text x="24" y="74" fill="#9cbdb0">guest@crystal:~ $</text><text x="180.24" y="74" fill="#dddce2" clip-path="url(#type-2)">/skill</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7288;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="97" fill="#c8ace8" font-weight="600" xml:space="preserve">正在翻阅的手册</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7329;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="120" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7370;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="143" fill="#d5bcf1" xml:space="preserve">~/notes/</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7411;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="166" fill="#d5bcf1" xml:space="preserve">├── os/          processes · memory · concurrency</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7452;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="189" fill="#d5bcf1" xml:space="preserve">├── systems/     abstractions · architecture</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7493;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="212" fill="#d5bcf1" xml:space="preserve">├── agents/      tools · feedback · execution</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7534;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="235" fill="#d5bcf1" xml:space="preserve">└── graphics/    pixels · shaders · rendering</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7575;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="258" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7615;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="281" fill="#c9c8d0" xml:space="preserve">这是我感兴趣、想继续探索的方向，不是一张熟练度排行榜。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7656;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="304" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7697;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="327" fill="#c8ace8" font-weight="600" xml:space="preserve">从程序往下看</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7738;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="350" fill="#93939f" xml:space="preserve">…</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7779;0.9883" calcMode="discrete" dur="17.11s" repeatCount="indefinite"/><text x="24" y="373" fill="#9cbdb0">guest@crystal:~ $</text><rect x="180.24" y="361" width="8.68" height="16" fill="#c8ace8"><animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect></g></g>

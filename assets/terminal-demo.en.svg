<g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0117;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><clipPath id="type-0"><rect x="180.24" y="56" height="23" width="400"><animate attributeName="width" values="0;9.7;18.4;27.0;35.7;400" keyTimes="0;0.0188;0.0258;0.0329;0.0399;0.0469" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/></rect></clipPath><text x="24" y="74" fill="#9cbdb0">guest@crystal:~ $</text><text x="180.24" y="74" fill="#dddce2" clip-path="url(#type-0)">/help</text><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0646;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="97" fill="#c8ace8" xml:space="preserve">/help<tspan x="171.56" fill="#93939f">List every available command</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0687;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="120" fill="#c8ace8" xml:space="preserve">/whoami<tspan x="171.56" fill="#93939f">Meet AngeCrystal</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0728;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="143" fill="#c8ace8" xml:space="preserve">/skill<tspan x="171.56" fill="#93939f">Manuals currently open</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0769;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="166" fill="#c8ace8" xml:space="preserve">/hobby<tspan x="171.56" fill="#93939f">When the terminal idles</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0810;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="189" fill="#c8ace8" xml:space="preserve">/now<tspan x="171.56" fill="#93939f">What I'm up to · updated by hand</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0851;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="212" fill="#c8ace8" xml:space="preserve">/workflow<tspan x="171.56" fill="#93939f">How this project gets made</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0892;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="235" fill="#c8ace8" xml:space="preserve">/about-site<tspan x="171.56" fill="#93939f">Why this homepage is a terminal</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0933;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="258" fill="#c8ace8" xml:space="preserve">/chat<tspan x="171.56" fill="#93939f">Topics to start a conversation</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0974;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="281" fill="#c8ace8" xml:space="preserve">/patchpilot<tspan x="171.56" fill="#93939f">A Python coding-agent experiment</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1015;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="304" fill="#c8ace8" xml:space="preserve">/mini-renderer<tspan x="171.56" fill="#93939f">A graphics experiment that starts with a triangle</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1056;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="327" fill="#c8ace8" xml:space="preserve">/aaa<tspan x="171.56" fill="#93939f">Placeholder project example</tspan></text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1097;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="350" fill="#93939f" xml:space="preserve">… 4 more — type /help in the live terminal</text></g><g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1138;0.3251" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="373" fill="#9cbdb0">guest@crystal:~ $</text><rect x="180.24" y="361" width="8.68" height="16" fill="#c8ace8"><animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3369;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><clipPath id="type-1"><rect x="180.24" y="56" height="23" width="0"><animate attributeName="width" values="0;9.7;18.4;27.0;35.7;44.4;53.1;400" keyTimes="0;0.3439;0.3509;0.3580;0.3650;0.3721;0.3791;0.3862" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/></rect></clipPath><text x="24" y="74" fill="#9cbdb0">guest@crystal:~ $</text><text x="180.24" y="74" fill="#dddce2" clip-path="url(#type-1)">/whoami</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4038;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="97" fill="#c8ace8" font-weight="600" xml:space="preserve">AngeCrystal</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4079;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="120" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4120;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="143" fill="#c9c8d0" xml:space="preserve">Someone who likes opening black boxes, and stepping into stories.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4161;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="166" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4202;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="189" fill="#c9c8d0" xml:space="preserve">I'm interested in OS, systems, AI and agents. Knowing what a tool can do is not quite enough;</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4243;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="212" fill="#c9c8d0" xml:space="preserve">I also want to ask: why does it work this way, and what could it become?</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4284;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="235" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4325;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="258" fill="#c9c8d0" xml:space="preserve">This is a personal card that will keep growing. Look at the projects on the workbench, flip</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4366;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="281" fill="#c9c8d0" xml:space="preserve">through the directions I'm exploring, or step outside the terminal to talk about board games,</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4407;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="304" fill="#c9c8d0" xml:space="preserve">anime and gacha games.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4448;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="327" fill="#93939f" xml:space="preserve">…</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4489;0.6602" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="350" fill="#9cbdb0">guest@crystal:~ $</text><rect x="180.24" y="338" width="8.68" height="16" fill="#c8ace8"><animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6719;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><clipPath id="type-2"><rect x="180.24" y="56" height="23" width="0"><animate attributeName="width" values="0;9.7;18.4;27.0;35.7;44.4;400" keyTimes="0;0.6790;0.6860;0.6931;0.7001;0.7072;0.7142" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/></rect></clipPath><text x="24" y="74" fill="#9cbdb0">guest@crystal:~ $</text><text x="180.24" y="74" fill="#dddce2" clip-path="url(#type-2)">/skill</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7318;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="97" fill="#c8ace8" font-weight="600" xml:space="preserve">Manuals currently open</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7359;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="120" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7400;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="143" fill="#d5bcf1" xml:space="preserve">~/notes/</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7441;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="166" fill="#d5bcf1" xml:space="preserve">├── os/          processes · memory · concurrency</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7482;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="189" fill="#d5bcf1" xml:space="preserve">├── systems/     abstractions · architecture</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7523;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="212" fill="#d5bcf1" xml:space="preserve">├── agents/      tools · feedback · execution</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7565;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="235" fill="#d5bcf1" xml:space="preserve">└── graphics/    pixels · shaders · rendering</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7606;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="258" fill="#c9c8d0" xml:space="preserve"></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7647;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="281" fill="#c9c8d0" xml:space="preserve">These are directions I'm curious about and want to keep exploring, not a proficiency</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7688;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="304" fill="#c9c8d0" xml:space="preserve">leaderboard.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7729;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="327" fill="#93939f" xml:space="preserve">…</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7770;0.9883" calcMode="discrete" dur="17.04s" repeatCount="indefinite"/><text x="24" y="350" fill="#9cbdb0">guest@crystal:~ $</text><rect x="180.24" y="338" width="8.68" height="16" fill="#c8ace8"><animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect></g></g>
